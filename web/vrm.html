<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      #stage { display: block; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { VRMLoaderPlugin, VRMUtils, VRMHumanBoneName } from "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.min.js";

      const params = new URLSearchParams(location.search);
      const modelUrl = params.get("model");
      const size = parseInt(params.get("size") || "1024", 10);

      const canvas = document.getElementById("stage");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(size, size, false);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(1.5, 2.0, 2.0);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xcfe0ff, 0.8);
      fill.position.set(-1.5, 1.0, 1.0);
      scene.add(fill);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      let vrm = null;
      let modelRoot = null;
      let headBone = null;
      let ready = false;
      const CYCLE = 12;
      const TALK_SEGS = [[2, 4], [9, 10]];

      function setExpr(name, weight) {
        if (!vrm) return;
        const e = vrm.expressionManager && vrm.expressionManager.getExpression(name);
        if (e) e.weight = weight;
      }
      function segOpen(p) {
        for (const [a, b] of TALK_SEGS) {
          if (p >= a && p <= b) {
            const t = b > a ? (p - a) / (b - a) : 0.5;
            return Math.sin(t * Math.PI);
          }
        }
        return 0.0;
      }

      // VRM：待机 <-> 说话、眨眼、头部轻微偏航；普通 glTF/GLB：保持模型静态姿态
      function applyFrame(i) {
        if (!modelRoot) return;
        if (vrm) {
          const phase = ((i % CYCLE) + CYCLE) % CYCLE;
          const talk = segOpen(phase);
          // 嘴型：说话段按正弦开合，叠加轻微 ih 元音
          setExpr("aa", talk * 0.85);
          setExpr("ih", talk * 0.2);
          // 眨眼弧线：半闭 -> 闭合 -> 半睁
          const blink = phase === 5 ? 0.35 : phase === 6 ? 1.0 : phase === 7 ? 0.35 : 0.0;
          setExpr("blink", blink);
          // 头部轻微左右偏航（约 ±2.9°）+ 极轻微俯仰，不移动位置、不驱动躯干
          if (headBone) {
            headBone.rotation.y = 0.05 * Math.sin((i / CYCLE) * 2 * Math.PI);
            headBone.rotation.x = 0.015 * Math.sin((i / CYCLE) * 2 * Math.PI);
          }
          vrm.update(1 / 60);
        }
        renderer.render(scene, camera);
      }

      async function init() {
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        const gltf = await loader.loadAsync(modelUrl);
        vrm = gltf.userData.vrm;
        modelRoot = vrm ? vrm.scene : gltf.scene;
        if (!modelRoot) {
          throw new Error("模型文件没有可渲染的场景节点");
        }
        if (vrm) {
          VRMUtils.removeUnnecessaryJoints(vrm.scene);
          vrm.scene.rotation.y = Math.PI; // 模型正面朝向 +z 相机
          try {
            headBone = vrm.humanoid && vrm.humanoid.getBoneNode(VRMHumanBoneName.Head);
          } catch (e) {
            headBone = null;
          }
        }
        scene.add(modelRoot);

        // 按包围盒把相机对准模型
        const box = new THREE.Box3().setFromObject(modelRoot);
        const center = box.getCenter(new THREE.Vector3());
        const size3 = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size3.x, size3.y, size3.z) || 1;
        camera.position.set(center.x, center.y + size3.y * 0.05, center.z + maxDim * 2.2);
        camera.lookAt(center.x, center.y + size3.y * 0.02, center.z);
        camera.near = maxDim * 0.01;
        camera.far = maxDim * 20;
        camera.updateProjectionMatrix();

        applyFrame(0);
        let meshCount = 0;
        const mats = [];
        modelRoot.traverse((o) => {
          if (o.isMesh) {
            meshCount++;
            const m = o.material;
            mats.push({
              vis: o.visible,
              matVis: m && m.visible,
              opacity: m && m.opacity,
              transparent: m && m.transparent,
              map: !!(m && m.map),
            });
          }
        });
        const gl = renderer.getContext();
        if (!meshCount) {
          throw new Error("模型没有可渲染的网格");
        }
        window.__debug = {
          center: [center.x, center.y, center.z],
          size: [size3.x, size3.y, size3.z],
          maxDim,
          camera: [camera.position.x, camera.position.y, camera.position.z],
          meshCount,
          isWebGL2: renderer.capabilities.isWebGL2,
          glOk: !!gl,
          hasHead: !!headBone,
          isVRM: !!vrm,
          mats: mats.slice(0, 5),
        };
        ready = true;
        window.__ready = true;
      }

      window.__setFrame = (i) => applyFrame(i);
      window.__snapshot = () => canvas.toDataURL("image/png");
      window.__ready = false;

      init().catch((err) => {
        console.error("3D init failed:", err);
        window.__error = String(err && err.message ? err.message : err);
      });
    </script>
  </body>
</html>
